<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management — TBI Task Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="tbi-wrapper">
  <div id="sidebarContainer"></div>
  <div class="tbi-main-wrap">
    <div id="topbarContainer"></div>
    <main class="tbi-content" id="pageContent"></main>
  </div>
</div>

<!-- Add Employee Modal -->
<div class="modal fade" id="addEmpModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-700"><i class="bi bi-person-plus me-2"></i>Add New Employee</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="addEmpAlert"></div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label fw-500">Full Name <span class="text-danger">*</span></label><input type="text" class="form-control" id="newName" required></div>
          <div class="col-md-6">
            <label class="form-label fw-500">Designation <span class="text-danger">*</span></label>
            <select class="form-select" id="newDesig" required>
              <option value="">Select…</option>
            </select>
          </div>
          <div class="col-md-6"><label class="form-label fw-500">Email <span class="text-danger">*</span></label><input type="email" class="form-control" id="newEmail" required></div>
          <div class="col-md-6"><label class="form-label fw-500">Phone</label><input type="tel" class="form-control" id="newPhone" placeholder="+91 XXXXX XXXXX"></div>
          <div class="col-12"><label class="form-label fw-500">Photo URL</label><input type="url" class="form-control" id="newPhoto" placeholder="https://…"></div>
          <div class="col-md-6"><label class="form-label fw-500">Username <span class="text-danger">*</span></label><input type="text" class="form-control" id="newUsername" required autocomplete="off"></div>
          <div class="col-md-6"><label class="form-label fw-500">Password <span class="text-danger">*</span></label><input type="password" class="form-control" id="newPassword" required minlength="8" placeholder="Min 8 characters" autocomplete="new-password"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="addEmployee()">Add Employee</button>
      </div>
    </div>
  </div>
</div>

<!-- Reset Password Modal -->
<div class="modal fade" id="resetPwdModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content border-0">
      <div class="modal-header">
        <h6 class="modal-title fw-700">Reset Password</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted mb-2">Reset password for <strong id="resetEmpName"></strong></p>
        <div id="resetPwdAlert"></div>
        <input type="password" class="form-control" id="resetNewPwd" minlength="8" required placeholder="New password (min 8 chars)">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-warning" onclick="doResetPwd()">Reset</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
let _resetUserId = '';

document.addEventListener('DOMContentLoaded', () => {
  if (!renderShell('Employee Management', true)) return;

  const tasks     = DB.getAll('tasks');
  const employees = DB.getAll('employees');
  const users     = DB.getAll('users');
  const userByEmp = Object.fromEntries(users.map(u => [u.Employee_ID, u]));

  const order = ['CEO','COO','Software Associate','Finance Associate','Innovation Associate','Supporting Staff'];
  employees.sort((a,b) => { const ai=order.indexOf(a.Designation); const bi=order.indexOf(b.Designation); return (ai<0?99:ai)-(bi<0?99:bi); });

  // Populate designation select
  const desigSel = document.getElementById('newDesig');
  DESIGNATIONS.forEach(d => { const o=document.createElement('option'); o.value=o.textContent=d; desigSel.appendChild(o); });

  const empCards = employees.map(emp => {
    const stats   = Utils.employeeStats(tasks, emp.Employee_ID);
    const ini     = Utils.initials(emp.Name);
    const user    = userByEmp[emp.Employee_ID];
    const pctCl   = Utils.pctColor(stats.approvalPct);
    const empUrl  = `tasks.html?employee=${encodeURIComponent(emp.Employee_ID)}`;
    return `
      <div class="col-12 col-md-6 col-xl-4">
        <div class="emp-card" onclick="window.location='${empUrl}'" role="link" tabindex="0" onkeydown="if(event.key==='Enter')window.location='${empUrl}'">
          <div class="emp-card-header">
            ${emp.Photo_URL ? `<img src="${Utils.esc(emp.Photo_URL)}" class="emp-avatar" alt="${Utils.esc(emp.Name)}">` : `<div class="emp-avatar-initials">${Utils.esc(ini)}</div>`}
            <div>
              <div class="emp-name">${Utils.esc(emp.Name)}</div>
              <div class="emp-desig">${Utils.esc(emp.Designation)}</div>
              <div style="font-size:.68rem" class="text-muted mt-1">${Utils.esc(emp.Email)}</div>
            </div>
          </div>
          <div class="row g-2 text-center mb-3">
            <div class="col-3"><div class="emp-stat-val text-primary">${stats.total}</div><div class="emp-stat-lbl">Total</div></div>
            <div class="col-3"><div class="emp-stat-val text-success">${stats.completed}</div><div class="emp-stat-lbl">Done</div></div>
            <div class="col-3"><div class="emp-stat-val text-warning">${stats.pending}</div><div class="emp-stat-lbl">Pending</div></div>
            <div class="col-3"><div class="emp-stat-val text-danger">${stats.overdue}</div><div class="emp-stat-lbl">Overdue</div></div>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between mb-1">
              <small class="text-muted">Approval Rate</small>
              <small class="fw-600">${stats.approvalPct}%</small>
            </div>
            <div class="progress" style="height:5px"><div class="progress-bar bg-${pctCl}" style="width:${stats.approvalPct}%"></div></div>
          </div>
          <div class="d-flex gap-2" onclick="event.stopPropagation()">
            <a href="${empUrl}" class="btn btn-sm btn-outline-primary flex-fill"><i class="bi bi-list-task me-1"></i>Tasks</a>
            ${user ? `<button class="btn btn-sm btn-outline-warning" onclick="event.stopPropagation();openResetPwd('${Utils.esc(user.User_ID)}','${Utils.esc(emp.Name)}')" title="Reset Password"><i class="bi bi-key"></i></button>` : ''}
          </div>
          ${user ? `<div class="emp-card-footer"><i class="bi bi-person-circle me-1"></i>Login: <code>${Utils.esc(user.Username)}</code></div>` : ''}
        </div>
      </div>`;
  }).join('');

  document.getElementById('pageContent').innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-700 mb-0"><i class="bi bi-people-fill me-2 text-primary"></i>Employee Management</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEmpModal"><i class="bi bi-person-plus me-1"></i>Add Employee</button>
    </div>
    <div class="row g-3">${empCards}</div>
  `;
});

function addEmployee() {
  const name     = document.getElementById('newName').value.trim();
  const desig    = document.getElementById('newDesig').value;
  const email    = document.getElementById('newEmail').value.trim();
  const phone    = document.getElementById('newPhone').value.trim();
  const photo    = document.getElementById('newPhoto').value.trim();
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const alertEl  = document.getElementById('addEmpAlert');

  if (!name || !desig || !email || !username || !password) {
    alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">All required fields must be filled.</div>`; return;
  }
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRe.test(email)) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">Invalid email address.</div>`; return; }
  if (password.length < 8) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">Password must be at least 8 characters.</div>`; return; }
  if (DB.findOne('users','Username',username)) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">Username already exists.</div>`; return; }

  const empId = Utils.generateId('EMP');
  DB.append('employees', {Employee_ID:empId, Name:name, Designation:desig, Email:email, Phone:phone, Photo_URL:photo, Status:'Active'});
  DB.append('users', {User_ID:Utils.generateId('USR'), Username:username, Password:password, Designation:desig, Employee_ID:empId, Email:email, Name:name});
  setFlash('success', `Employee ${name} added successfully.`);
  bootstrap.Modal.getInstance(document.getElementById('addEmpModal'))?.hide();
  location.reload();
}

function openResetPwd(userId, empName) {
  _resetUserId = userId;
  document.getElementById('resetEmpName').textContent = empName;
  document.getElementById('resetNewPwd').value = '';
  document.getElementById('resetPwdAlert').innerHTML = '';
  new bootstrap.Modal(document.getElementById('resetPwdModal')).show();
}

function doResetPwd() {
  const newPwd  = document.getElementById('resetNewPwd').value;
  const alertEl = document.getElementById('resetPwdAlert');
  if (!newPwd || newPwd.length < 8) { alertEl.innerHTML = `<div class="alert alert-danger py-2 small mb-2">Password must be at least 8 characters.</div>`; return; }
  DB.updateById('users', 'User_ID', _resetUserId, {Password: newPwd});
  setFlash('success', 'Password reset successfully.');
  bootstrap.Modal.getInstance(document.getElementById('resetPwdModal'))?.hide();
  location.reload();
}
</script>
</body>
</html>
