<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks — ME-RIISE FOUNDATION</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="../assets/css/style.css" rel="stylesheet">
<style>
  /* Clickable task cards — hover lift handled in CSS so no per-card JS binding is needed */
  .task-card { cursor: pointer; transition: box-shadow .2s ease, transform .2s ease; }
  .task-card:hover { box-shadow: 0 8px 16px rgba(0,0,0,0.2) !important; transform: translateY(-2px); }
  .task-card:focus-visible { outline: 2px solid var(--theme-primary, #3b82f6); outline-offset: 2px; }
</style>
</head>
<body>
<div class="tbi-wrapper">
  <div id="sidebarContainer"></div>
  <div class="tbi-main-wrap">
    <div id="topbarContainer"></div>
    <main class="tbi-content" id="pageContent"></main>
  </div>
</div>

<!-- Task Details Modal -->
<div class="modal fade" id="taskDetailsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-700" id="taskDetailTitle"></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="taskDetailContent">
        <!-- Content loaded dynamically -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Complete Task Modal -->
<div class="modal fade" id="completeModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0">
      <div class="modal-header bg-success text-white">
        <h6 class="modal-title fw-700"><i class="bi bi-check2-circle me-2"></i>Mark Task as Completed</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2">Mark <strong id="completeTaskTitle"></strong> as completed?</p>
        <div class="mb-3">
          <label class="form-label">Completion Notes / Work Summary</label>
          <textarea class="form-control" id="completionNotes" rows="3" placeholder="Briefly describe what was accomplished…"></textarea>
        </div>
        <div class="alert alert-info py-2 small mb-0">
          <i class="bi bi-info-circle me-1"></i>This will be sent to admin for approval.
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" onclick="submitComplete()">Submit for Approval</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
<script>
let _completeTaskId = '';

document.addEventListener('DOMContentLoaded', async () => {
  await TBI.ready();
  if (!renderShell('My Tasks')) return;
  renderPage();
  TBI.onSync(renderPage);   // repaint when another dashboard changes the data

  // A single delegated listener on the stable page container handles clicks for
  // every task card. Because it is bound once to an element that survives each
  // re-render, cards never lose their handler and never get bound twice (the old
  // per-card binding double-bound on load, which opened the modal twice and left
  // a stray backdrop that froze the page).
  const container = document.getElementById('pageContent');
  container.addEventListener('click', (e) => {
    // Let interactive controls inside the card (status dropdown, attachment link,
    // anything with its own handler) work without opening the details modal.
    if (e.target.closest('a, button, .btn-group, .dropdown-menu, [onclick]')) return;
    const card = e.target.closest('.task-card');
    if (card) {
      const taskId = card.getAttribute('data-task-id');
      if (taskId) openTaskDetails(taskId);
    }
  });
  // Keyboard access: Enter/Space on a focused card opens its details.
  container.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.task-card');
    if (card && e.target === card) {
      e.preventDefault();
      const taskId = card.getAttribute('data-task-id');
      if (taskId) openTaskDetails(taskId);
    }
  });

  // Safety net: whenever the details modal closes, remove any leftover Bootstrap
  // backdrop/scroll-lock so the page can never end up frozen behind an invisible
  // overlay.
  const modalEl = document.getElementById('taskDetailsModal');
  modalEl.addEventListener('hidden.bs.modal', () => {
    document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
    document.body.classList.remove('modal-open');
    document.body.style.removeProperty('overflow');
    document.body.style.removeProperty('padding-right');
  });
});

function renderPage() {
  const session  = Auth.getSession();
  const myEmpId  = session.employee_id;
  // Newest first: most recently assigned at the top.
  const allTasks = DB.findMany('tasks', 'Employee_ID', myEmpId).slice().reverse();
  allTasks.sort((a, b) => {
    const da = (a.Assigned_Date || '') + ' ' + (a.Deadline_Time || '');
    const db = (b.Assigned_Date || '') + ' ' + (b.Deadline_Time || '');
    return db.localeCompare(da);
  });
  const params   = getParams();
  const tab      = params.get('tab') || 'all';
  const fSearch  = (params.get('q') || '').trim();

  const tabDefs = {
    all:        {label:'All Tasks',    filter: t => true},
    pending:    {label:'Pending',      filter: t => t.Status==='Pending'},
    inprogress: {label:'In Progress',  filter: t => t.Status==='In Progress'},
    completed:  {label:'Completed',    filter: t => ['Completed','Approved'].includes(t.Status)},   // approved tasks are completed tasks
    approved:   {label:'Approved',     filter: t => t.Status==='Approved'},
    rejected:   {label:'Rejected',     filter: t => t.Status==='Rejected'},
    overdue:    {label:'Overdue',       filter: t => Utils.isOverdue(t.Deadline, t.Status)},
  };

  let filtered = allTasks.filter(tabDefs[tab]?.filter || (() => true));
  if (fSearch) filtered = filtered.filter(t => ((t.Task_Title||'')+(t.Description||'')).toLowerCase().includes(fSearch.toLowerCase()));

  const tabLinks = Object.entries(tabDefs).map(([k,v]) => {
    const cnt = allTasks.filter(v.filter).length;
    const isActive = tab === k;
    return `<li class="nav-item"><a class="nav-link ${isActive?'active':''}" href="?tab=${k}${fSearch?'&q='+encodeURIComponent(fSearch):''}">${v.label}${cnt>0?`<span class="badge ${isActive?'bg-white':'bg-secondary'} ms-1">${cnt}</span>`:''}</a></li>`;
  }).join('');

  const pendingApprovalIds = new Set(DB.getAll('approvals').filter(a => a.Status === 'Pending').map(a => a.Task_ID));

  const taskCards = filtered.length ? filtered.map(t => {
    const od     = Utils.isOverdue(t.Deadline, t.Status);
    const days   = Utils.daysPending(t.Deadline);
    const canAct = ['Pending','In Progress'].includes(t.Status);
    const statusOpts = ['Pending','In Progress','Completed'].map(opt => {
      if (opt==='Completed') {
        return `<li><button class="dropdown-item${t.Status===opt?' active':''}" onclick="openCompleteModal('${t.Task_ID}','${Utils.esc(t.Task_Title.replace(/'/g,"\\'"))}')">Completed</button></li>`;
      }
      return `<li><button class="dropdown-item${t.Status===opt?' active':''}" onclick="updateStatus('${t.Task_ID}','${opt}')">${opt}</button></li>`;
    }).join('');
    return `
      <div class="col-12 col-md-6 col-xl-4">
        <div class="card border-0 shadow-sm h-100 ${od?'border-start border-danger border-3':''} task-card" data-task-id="${Utils.esc(t.Task_ID)}" role="button" tabindex="0" aria-label="View details for ${Utils.esc(t.Task_Title)}">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h6 class="fw-600 mb-0 flex-fill me-2">${Utils.esc(t.Task_Title)}</h6>
              <div class="d-flex gap-1 flex-shrink-0">${Utils.priorityBadge(t.Priority)} ${Utils.statusBadge(t.Status)}</div>
            </div>
            ${t.Description?`<p class="text-muted small mb-2">${Utils.esc(t.Description.slice(0,120))}${t.Description.length>120?'…':''}</p>`:''}
            <div class="d-flex flex-wrap gap-3 small mb-2 text-muted">
              <span><i class="bi bi-calendar-plus me-1"></i>${Utils.formatDate(t.Assigned_Date)}</span>
              <span class="${od?'text-danger fw-600':''}"><i class="bi bi-calendar-x me-1"></i>${Utils.formatDate(t.Deadline)}</span>
            </div>
            ${od?`<div class="badge bg-danger bg-opacity-10 text-danger mb-2 d-inline-block"><i class="bi bi-exclamation-circle me-1"></i>${days} day${days>1?'s':''} overdue</div>`:''}
            ${t.Notes?`<div class="alert alert-light py-1 small mb-2"><i class="bi bi-chat-text me-1"></i><strong>Feedback:</strong> ${Utils.esc(t.Notes.slice(0,80))}${t.Notes.length>80?'…':''}</div>`:''}
            ${t.File_URL?`<a href="${Utils.esc(t.File_URL)}" target="_blank" class="btn btn-sm btn-outline-secondary mb-2" onclick="event.stopPropagation();"><i class="bi bi-paperclip me-1"></i>Attachment</a>`:''}
            <div class="mt-auto">
              ${canAct?`
                <div class="btn-group w-100" onclick="event.stopPropagation();">
                  <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle w-100" data-bs-toggle="dropdown">Change Status</button>
                  <ul class="dropdown-menu w-100">${statusOpts}</ul>
                </div>` : ''}
              ${t.Status==='Completed' ? (pendingApprovalIds.has(t.Task_ID)
                ? `<div class="alert alert-info py-1 small mt-2 mb-0"><i class="bi bi-clock me-1"></i>Awaiting admin approval…</div>`
                : `<div class="alert alert-success py-1 small mt-2 mb-0"><i class="bi bi-check2-circle me-1"></i>Completed${t.Completed_Date?` on ${Utils.formatDateTime(t.Completed_Date)}`:''}</div>`) : ''}
              ${t.Status==='Approved'?`<div class="alert alert-success py-1 small mt-2 mb-0"><i class="bi bi-check2-all me-1"></i>Completed &amp; approved${t.Completed_Date?` — ${Utils.formatDateTime(t.Completed_Date)}`:''}</div>`:''}
            </div>
          </div>
        </div>
      </div>`;
  }).join('') : `
    <div class="col-12 text-center py-5 text-muted">
      <i class="bi bi-inbox fs-1 d-block mb-2"></i>
      No tasks found${fSearch?' for "'+Utils.esc(fSearch)+'"':''}
    </div>`;

  document.getElementById('pageContent').innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-700 mb-0"><i class="bi bi-list-task me-2 text-primary"></i>My Tasks</h4>
    </div>
    <ul class="nav nav-pills flex-wrap gap-1 mb-3">${tabLinks}</ul>
    <form class="mb-3 d-flex gap-2" onsubmit="doSearch(event)">
      <input type="text" class="form-control" id="searchInput" placeholder="Search tasks…" value="${Utils.esc(fSearch)}">
      <button type="submit" class="btn btn-primary">Search</button>
      ${fSearch?`<a href="?tab=${tab}" class="btn btn-outline-secondary">Clear</a>`:''}
    </form>
    <div class="row g-3">${taskCards}</div>
  `;
  // No per-card listeners are attached here: a single delegated click/keydown
  // handler bound once in DOMContentLoaded covers every card, including the ones
  // this re-render just created.
}

function doSearch(e) {
  e.preventDefault();
  const q   = document.getElementById('searchInput').value.trim();
  const tab = getParams().get('tab') || 'all';
  window.location.href = `tasks.html?tab=${tab}${q?'&q='+encodeURIComponent(q):''}`;
}

function openCompleteModal(taskId, taskTitle) {
  _completeTaskId = taskId;
  document.getElementById('completeTaskTitle').textContent = taskTitle;
  document.getElementById('completionNotes').value = '';
  new bootstrap.Modal(document.getElementById('completeModal')).show();
}

function submitComplete() {
  const notes   = document.getElementById('completionNotes').value.trim();
  const session = Auth.getSession();
  const task    = DB.findOne('tasks', 'Task_ID', _completeTaskId);
  if (!task || task.Employee_ID !== session.employee_id) return;

  const existing  = DB.findMany('approvals', 'Task_ID', _completeTaskId);
  const hasPending = existing.some(a => a.Status === 'Pending');
  if (hasPending) {
    showFlash('warning', 'This task is already awaiting approval.');
    bootstrap.Modal.getInstance(document.getElementById('completeModal'))?.hide();
    return;
  }

  DB.updateById('tasks', 'Task_ID', _completeTaskId, {Status:'Completed', Notes:notes, Completed_Date: task.Completed_Date || Utils.nowStamp()});
  DB.append('approvals', {
    Approval_ID: Utils.generateId('APR'), Task_ID: _completeTaskId,
    Employee_ID: session.employee_id, Status: 'Pending',
    Approved_By: '', Comments: '', Approval_Date: '',
    Submission_Date: new Date().toISOString().replace('T',' ').slice(0,19)
  });

  setFlash('success', 'Task marked as completed and sent for approval.');
  bootstrap.Modal.getInstance(document.getElementById('completeModal'))?.hide();
  renderPage();
  showFlash('success', 'Task marked as completed and sent for approval.');
}

function updateStatus(taskId, newStatus) {
  const session = Auth.getSession();
  const task    = DB.findOne('tasks', 'Task_ID', taskId);
  if (!task || task.Employee_ID !== session.employee_id) return;
  DB.updateById('tasks', 'Task_ID', taskId, {Status: newStatus});
  setFlash('success', 'Task status updated.');
  renderPage();
  showFlash('success', 'Task status updated.');
}

function openTaskDetails(taskId) {
  try {
    const session = Auth.getSession();
    const task = DB.findOne('tasks', 'Task_ID', taskId);
    if (!task || task.Employee_ID !== session.employee_id) {
      console.warn('Task not found or unauthorized access');
      return;
    }

    const od = Utils.isOverdue(task.Deadline, task.Status);
    const days = Utils.daysPending(task.Deadline);

    // textContent escapes on its own; passing Utils.esc() here would double-encode
    // characters like & in the title.
    document.getElementById('taskDetailTitle').textContent = task.Task_Title || 'Task Details';

    // The "Attachment Note" field may hold either a real URL or a plain-text note.
    const fileUrl  = (task.File_URL || '').trim();
    const isLink   = /^(https?:\/\/|www\.)/i.test(fileUrl);
    const linkHref = fileUrl && /^www\./i.test(fileUrl) ? 'https://' + fileUrl : fileUrl;

    const detailsHTML = `
      <div class="row g-3">
        <div class="col-12">
          <div class="d-flex gap-2 flex-wrap">
            ${Utils.priorityBadge(task.Priority)}
            ${Utils.statusBadge(task.Status)}
            ${od ? `<span class="badge bg-danger"><i class="bi bi-exclamation-circle me-1"></i>${days} day${days>1?'s':''} overdue</span>` : ''}
          </div>
        </div>
        <div class="col-12">
          <h6 class="fw-600 mb-2"><i class="bi bi-file-text me-2"></i>Description</h6>
          <p class="mb-0 ${task.Description ? 'text-muted' : 'text-muted fst-italic'}" style="white-space: pre-wrap; word-wrap: break-word;">${task.Description ? Utils.esc(task.Description) : 'No description was provided for this task.'}</p>
        </div>
        <div class="col-12">
          <h6 class="fw-600 mb-3">Task Details</h6>
          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="small text-muted"><i class="bi bi-flag me-2"></i>Priority</div>
              <p class="mb-0 fw-500">${Utils.esc(task.Priority || '—')}</p>
            </div>
            <div class="col-md-6 mb-3">
              <div class="small text-muted"><i class="bi bi-hourglass-split me-2"></i>Current Status</div>
              <p class="mb-0 fw-500">${Utils.esc(task.Status)}</p>
            </div>
            <div class="col-md-6 mb-3">
              <div class="small text-muted"><i class="bi bi-calendar-plus me-2"></i>Assigned Date</div>
              <p class="mb-0 fw-500">${Utils.formatDate(task.Assigned_Date)}</p>
            </div>
            <div class="col-md-6 mb-3">
              <div class="small text-muted"><i class="bi bi-calendar-x me-2"></i>Deadline</div>
              <p class="mb-0 fw-500 ${od ? 'text-danger' : ''}">${Utils.formatDate(task.Deadline)} ${task.Deadline_Time ? `<small>at ${Utils.esc(task.Deadline_Time)}</small>` : ''}</p>
            </div>
            <div class="col-md-6 mb-3">
              <div class="small text-muted"><i class="bi bi-person me-2"></i>Assigned By</div>
              <p class="mb-0 fw-500">${Utils.esc(task.Assigned_By) || '—'}</p>
            </div>
            ${task.Completed_Date ? `
            <div class="col-md-6 mb-3">
              <div class="small text-muted"><i class="bi bi-check2-circle me-2"></i>Completed Date</div>
              <p class="mb-0 fw-500">${Utils.formatDateTime(task.Completed_Date)}</p>
            </div>
            ` : ''}
          </div>
        </div>
        ${task.Notes ? `
        <div class="col-12">
          <h6 class="fw-600 mb-2"><i class="bi bi-chat-text me-2"></i>Admin Feedback</h6>
          <div class="alert alert-info py-3 px-3 mb-0" style="white-space: pre-wrap; word-wrap: break-word;">${Utils.esc(task.Notes)}</div>
        </div>
        ` : ''}
        ${fileUrl ? `
        <div class="col-12">
          <h6 class="fw-600 mb-2"><i class="bi bi-paperclip me-2"></i>Attachment</h6>
          ${isLink
            ? `<a href="${Utils.esc(linkHref)}" target="_blank" rel="noopener" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-up-right me-1"></i>Open Attachment</a>`
            : `<p class="mb-0" style="white-space: pre-wrap; word-wrap: break-word;">${Utils.esc(fileUrl)}</p>`}
        </div>
        ` : ''}
      </div>
    `;

    document.getElementById('taskDetailContent').innerHTML = detailsHTML;
    // getOrCreateInstance reuses the one modal instance instead of spawning a new
    // one per click (which stacked backdrops and left the page frozen).
    const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('taskDetailsModal'), {keyboard: true});
    modal.show();
  } catch (err) {
    console.error('Error opening task details:', err);
    showFlash('error', 'Failed to open task details');
  }
}
</script>
</body>
</html>
