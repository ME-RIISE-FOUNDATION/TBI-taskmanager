name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -z "${{ secrets.HOSTINGER_WEB_HOOK }}" ]; then
            echo "Error: HOSTINGER_WEB_HOOK secret is not set"
            exit 1
          fi
          curl -X POST "${{ secrets.HOSTINGER_WEB_HOOK }}"
